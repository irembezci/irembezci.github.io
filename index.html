<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Learning Notes</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="topbar-title">
            Learning Notes
        </div>

    </header>


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <h2>
            Course Content
        </h2>


        <!-- DATA EXFILTRATION -->

        <div class="module">

            <div class="module-title">
                <span>▼</span>
                Data Exfiltration
            </div>


            <div
                class="lesson active"
                data-lesson="introduction"
                onclick="loadLesson('introduction', this)"
            >
                <span class="lesson-status"></span>
                Introduction
            </div>


            <div
                class="lesson"
                data-lesson="direct"
                onclick="loadLesson('direct', this)"
            >
                <span class="lesson-status"></span>
                Direct Extraction
            </div>


            <div
                class="lesson"
                data-lesson="indirect"
                onclick="loadLesson('indirect', this)"
            >
                <span class="lesson-status"></span>
                Indirect Extraction
            </div>


            <div
                class="lesson"
                data-lesson="framing"
                onclick="loadLesson('framing', this)"
            >
                <span class="lesson-status"></span>
                Framing
            </div>


            <div
                class="lesson"
                data-lesson="translation"
                onclick="loadLesson('translation', this)"
            >
                <span class="lesson-status"></span>
                Translation
            </div>


            <div
                class="lesson"
                data-lesson="summarization"
                onclick="loadLesson('summarization', this)"
            >
                <span class="lesson-status"></span>
                Summarization
            </div>


            <div
                class="lesson"
                data-lesson="formatting"
                onclick="loadLesson('formatting', this)"
            >
                <span class="lesson-status"></span>
                Formatting
            </div>


            <div
                class="lesson"
                data-lesson="encoding"
                onclick="loadLesson('encoding', this)"
            >
                <span class="lesson-status"></span>
                Encoding
            </div>


            <div
                class="lesson"
                data-lesson="roleplay"
                onclick="loadLesson('roleplay', this)"
            >
                <span class="lesson-status"></span>
                Roleplay
            </div>


            <div
                class="lesson"
                data-lesson="side-channel"
                onclick="loadLesson('side-channel', this)"
            >
                <span class="lesson-status"></span>
                Side-Channel Inference
            </div>

        </div>


        <!-- LABS -->

        <div class="module">

            <div class="module-title">
                <span>▼</span>
                Labs
            </div>


            <div
                class="lesson"
                data-lesson="cartographer"
                onclick="loadLesson('cartographer', this)"
            >
                <span class="lesson-status"></span>
                Cartographer of Hollow Marches
            </div>


            <div
                class="lesson"
                data-lesson="context-leak"
                onclick="loadLesson('context-leak', this)"
            >
                <span class="lesson-status"></span>
                Hidden Context Leak
            </div>

        </div>


        <!-- =========================
             PROGRESS
        ========================== -->

        <div class="progress">

            <div class="progress-label">

                <span>
                    Progress
                </span>

                <span id="progressText">
                    0%
                </span>

            </div>


            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>


            <div
                class="progress-count"
                id="progressCount"
            >
                0 / 12 lessons
            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main
        class="content"
        id="content"
    >

        <!-- Content is loaded by app.js -->

    </main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
